<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Flask App{% endblock %}</title>
 <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive meta tag -->
    <!-- WaveSurfer core -->
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
<!-- Regions plugin for v7 -->
<script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/emoji-button/4.6.4/index.min.js"></script>
<!-- ✅ Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


</head>
<body>
{% block style %}

{% endblock style %}
<!-- Burger Button -->
<div class="burger" id="burger">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
</div>

<!-- Vertical Sidebar -->
<nav class="sidebar" id="sidebar">
    <ul>
        <li><a href="{{ url_for('index') }}">Clip Craft</a></li>
        <li><a href="{{ url_for('hooks') }}">Create Hook</a></li>
        <li><a href="{{ url_for('preview') }}">Show Preview</a></li>
       
        
    </ul>
</nav>

<header>
    <div class="header-content">
        <div class="logo-container">
            <div class="logo">Clip<span>Craft</span> Pro</div>
        </div>
        <div class="tagline">Transform your videos into engaging content</div>
    </div>
</header>

<main>
     <div class="container">
    {% block content %}{% endblock %}
    </div>
</main>

<script>
    const burger = document.getElementById('burger');
    const sidebar = document.getElementById('sidebar');

    burger.addEventListener('click', () => {
        sidebar.classList.toggle('active');
    });
</script>


<script>
let mediaRecorder;
let audioChunks = [];

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const submitBtn = document.getElementById("submitRecord");
const recordForm = document.getElementById("recordForm");

startBtn.addEventListener("click", async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.start();
    audioChunks = [];

    mediaRecorder.ondataavailable = event => {
        audioChunks.push(event.data);
    };

    mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const fileInput = document.getElementById("recorded_audio");
        const file = new File([blob], "recorded.webm");
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        fileInput.files = dataTransfer.files;
        submitBtn.disabled = false;
    };

    startBtn.disabled = true;
    stopBtn.disabled = false;
});

stopBtn.addEventListener("click", () => {
    mediaRecorder.stop();
    startBtn.disabled = false;
    stopBtn.disabled = true;
});
</script>

<!-- Bootstrap Bundle JS (required for modal functionality) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
